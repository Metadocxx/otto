<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Metapedia Bhakti</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f6f2;
      color: #333;
    }
    header {
      background: url("sebastien-gabriel--IMlv9Jlb24-unsplash.jpg") no-repeat center;
      background-size: cover;
      background-position: 50% 20%;
      color: white;
      text-align: center;
      padding: 4rem 2rem;
      position: relative;
    }
    header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
    }
    header h1 {
      position: relative;
      z-index: 1;
    }
    nav {
      background: #333;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      padding: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      background: #555;
    }
    section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      color: #d4af37;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      background: #d4af37;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #b38e2e;
    }
    .contact-info {
      margin-top: 2rem;
      text-align: center;
    }
    .contact-info p {
      margin: 0.5rem 0;
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>📞 Contact Us</h1>
    <p>We’d love to hear from you</p>
  </header>

  <nav>
    <a href="colder.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="vlogs.html">Vlogs</a>
    <a href="videos.html">Videos</a>
    <a href="colder_shop.html">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h2>Send us a message</h2>
    <form>
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <h2>Other ways to reach us</h2>
      <p>Email: admin@metapediabhakti.com</p>
      <p>Phone: +91 98765 43210</p>
      <p>Address: Rewari, Haryana, India</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Metapedia Bhakti. All rights reserved.</p>
  </footer>

</body>
</html>
